# ------------------------------------------------------------------ CV match score
# "skills" = what your CVs actually show. "gaps" = common requirements they don't show.
profile:
  experience_years: 2          # Elta student 2024–25 + engineer since Apr 2025
  penalty_per_year: 0.22
  min_evidence: 10
  highlight_score: 60
  apply_score: 60
  skip_student_roles: true

  skills:
    # RF / EW
    "rf": {weight: 4, aliases: ["radio frequency", "microwave", "rf systems", "rf testing", "rf test", "מיקרוגל"]}
    "electronic warfare": {weight: 4, aliases: ["ew", "ew systems", "threat simulation", "threat scenarios", "ew simulation", "לוחמה אלקטרונית", "לל\"א"]}
    "rf lab equipment": {weight: 4, aliases: ["spectrum analyzer", "spectrum analyzers", "network analyzer", "network analyzers", "vna", "signal generator", "signal generators", "rf measurements", "rf instrumentation"]}
    "signal analysis": {weight: 3, aliases: ["vsa", "vector signal analysis", "modulation", "spectrum analysis", "signal processing analysis", "ניתוח אותות"]}
    "rf simulation": {weight: 2, aliases: ["cst", "em simulation", "electromagnetic simulation", "twta", "twt"]}
    "simulation": {weight: 2, aliases: ["simulator", "simulators", "simulations", "סימולציה", "סימולטור"]}
    # integration / validation
    "system integration": {weight: 4, aliases: ["hw/sw integration", "integration engineer", "integrator", "subsystem integration", "system deployment", "שילובים"]}
    "integration": {weight: 2, aliases: ["אינטגרציה"]}
    "system engineering": {weight: 3, aliases: ["system engineer", "systems engineer", "systems engineering", "הנדסת מערכת", "מהנדס מערכת"]}
    "bring-up": {weight: 3, aliases: ["bring up", "bringup", "subsystem bring-up"]}
    "validation": {weight: 3, aliases: ["system validation", "hardware validation", "interface validation", "v&v", "ולידציה"]}
    "verification": {weight: 2, aliases: ["system verification", "וריפיקציה", "אימות"]}
    "testing": {weight: 2, aliases: ["electrical testing", "lab testing", "test procedures", "בדיקות"]}
    "lab": {weight: 3, aliases: ["oscilloscope", "oscilloscopes", "lab equipment", "lab instrumentation", "test equipment", "power supply", "power supplies", "מעבדה"]}
    "troubleshooting": {weight: 3, aliases: ["debugging", "debug", "root cause", "root-cause", "תקלות"]}
    "electrical interfaces": {weight: 2, aliases: ["interfaces", "interface validation", "hardware integration", "ממשקים"]}
    # tools
    "matlab": {weight: 3, aliases: ["simulink"]}
    "python": {weight: 2, aliases: ["scripting"]}
    "sql": {weight: 2, aliases: ["database", "databases", "sql server", "mysql"]}
    "circuit simulation": {weight: 1, aliases: ["ltspice", "spice", "psim"]}
    "fpga basics": {weight: 1, aliases: ["vivado", "rtl"]}
    # domain / general
    "defense": {weight: 2, aliases: ["defence", "airborne", "naval", "aerospace", "ביטחוני", "ביטחון", "בטחוני"]}
    "multidisciplinary": {weight: 1, aliases: ["cross-functional", "cross functional", "multidisciplinary", "multi-disciplinary", "רב תחומי"]}
    "hardware": {weight: 1, aliases: ["hw", "electronics", "חומרה", "אלקטרוניקה"]}
    "b.sc ee": {weight: 2, aliases: ["electrical engineering", "electronics engineering", "electrical and electronics", "b.sc in electrical", "הנדסת חשמל", "הנדסת אלקטרוניקה", "מהנדס חשמל"]}

  gaps:
