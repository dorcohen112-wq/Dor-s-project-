# ------------------------------------------------------------------ CV match score
# "skills" = what your CVs actually show. "gaps" = common requirements they don't show.
profile:
  experience_years: 2          # Elta student 2024–25 + engineer since Apr 2025
  penalty_per_year: 0.22
  min_evidence: 10
  highlight_score: 60
  apply_score: 60
  skip_student_roles: true

  skills:
    # RF / EW
    "rf": {weight: 3, aliases: ["radio frequency", "microwave", "rf systems", "rf testing", "rf test", "מיקרוגל"]}
    "electronic warfare": {weight: 3, aliases: ["ew", "ew systems", "threat simulation", "threat scenarios", "ew simulation", "לוחמה אלקטרונית", "לל\"א"]}
    # ★ highlighted: hands-on with measurement equipment (spectrum analyzer, oscilloscope, ...)
    "measurement equipment": {weight: 6, aliases: ["spectrum analyzer", "spectrum analyzers", "oscilloscope", "oscilloscopes", "scope", "scopes",
                              "network analyzer", "network analyzers", "vna", "signal generator", "signal generators", "power supply", "power supplies",
                              "test equipment", "lab equipment", "measurement equipment", "lab instrumentation", "rf instrumentation", "rf measurements",
                              "ציוד מדידה", "מכשור מדידה", "מכשירי מדידה", "אוסצילוסקופ", "סקופ", "ספקטרום אנלייזר", "מנתח ספקטרום", "מחולל אותות"]}
